<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Actuarial Data Explorer</title>
<style>
:root {
  color-scheme: light;
  --bg: #f6f6f4; --surface: #ffffff; --surface-2: #f0efec; --surface-3: #e8e7e3;
  --border: #e4e3de; --border-strong: #cbc9c2;
  --text: #0b0b0b; --text-2: #52514e; --text-3: #85847e;
  --accent: #2a78d6; --accent-weak: #e6f0fb; --accent-text: #1c5cab;
  --hover: #f3f7fd; --pos: #2a78d6; --neg: #e34948; --mid: #d9d8d3;
  --bad-bg: #fdecec; --bad-text: #b42d2c;
  --warn-bg: #fff7e3; --warn-border: #fab219;
  --shadow: 0 8px 28px rgba(0,0,0,.14);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --surface-2: #232321; --surface-3: #2c2c2a;
    --border: #2f2f2c; --border-strong: #45453f;
    --text: #f0efec; --text-2: #c3c2b7; --text-3: #8d8c84;
    --accent: #3987e5; --accent-weak: #1d2a3b; --accent-text: #86b6ef;
    --hover: #20262e; --pos: #3987e5; --neg: #e66767; --mid: #45453f;
    --bad-bg: #3a1f1f; --bad-text: #f29a9a;
    --warn-bg: #33290f; --warn-border: #c98500;
    --shadow: 0 8px 28px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --surface-2: #232321; --surface-3: #2c2c2a;
  --border: #2f2f2c; --border-strong: #45453f;
  --text: #f0efec; --text-2: #c3c2b7; --text-3: #8d8c84;
  --accent: #3987e5; --accent-weak: #1d2a3b; --accent-text: #86b6ef;
  --hover: #20262e; --pos: #3987e5; --neg: #e66767; --mid: #45453f;
  --bad-bg: #3a1f1f; --bad-text: #f29a9a;
  --warn-bg: #33290f; --warn-border: #c98500;
  --shadow: 0 8px 28px rgba(0,0,0,.5);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 13px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-variant-numeric: tabular-nums; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.muted { color: var(--text-3); }
.z { color: var(--text-3); }

/* ---------- top bar ---------- */
.top { display: flex; align-items: center; gap: 14px; height: 46px; padding: 0 12px; background: var(--surface); border-bottom: 1px solid var(--border); }
.brand { font-weight: 650; white-space: nowrap; }
.brand small { font-weight: 400; color: var(--text-3); margin-left: 6px; }
.tabs { display: flex; gap: 2px; }
.tab { border: 0; background: none; padding: 7px 12px; border-radius: 6px; color: var(--text-2); }
.tab:hover { background: var(--surface-2); }
.tab[aria-selected="true"] { background: var(--accent-weak); color: var(--accent-text); font-weight: 600; }
.spacer { flex: 1; }
.ctl { display: flex; align-items: center; gap: 6px; color: var(--text-2); white-space: nowrap; }
.ctl input, .ctl select { height: 28px; border: 1px solid var(--border-strong); border-radius: 6px; background: var(--surface); padding: 0 6px; }
.ctl input[type=number] { width: 90px; }
.iconbtn { border: 1px solid var(--border-strong); background: var(--surface); border-radius: 6px; height: 28px; padding: 0 9px; color: var(--text-2); }
.iconbtn:hover { background: var(--surface-2); color: var(--text); }
.iconbtn:disabled { opacity: .45; cursor: default; }

/* ---------- layout ---------- */
.layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); height: calc(100vh - 46px); }
.layout.nosb { grid-template-columns: 0 minmax(0, 1fr); }
.layout.nosb aside { display: none; }
aside { background: var(--surface); border-right: 1px solid var(--border); overflow: auto; padding: 10px 10px 40px; }
main { min-width: 0; overflow: hidden; display: flex; flex-direction: column; }
.page { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 10px 12px 12px; gap: 10px; }
.page.scroll { overflow: auto; }

/* ---------- sidebar ---------- */
.search { width: 100%; height: 32px; border: 1px solid var(--border-strong); border-radius: 7px; padding: 0 10px; background: var(--surface); }
.search:focus, .ctl input:focus, .pk input:focus, .facet input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.sbh { display: flex; align-items: center; justify-content: space-between; margin: 14px 0 6px; font-size: 11px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; color: var(--text-3); }
.sbh button { border: 0; background: none; color: var(--accent-text); font-size: 12px; text-transform: none; letter-spacing: 0; padding: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; border: 1px solid var(--border-strong); background: var(--surface-2); border-radius: 999px; padding: 2px 4px 2px 9px; font-size: 12px; }
.chip > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip b { font-weight: 600; }
.chip.off { opacity: .5; }
.chip button { border: 0; background: none; color: var(--text-3); width: 18px; height: 18px; border-radius: 50%; padding: 0; line-height: 1; }
.chip button:hover { background: var(--surface-3); color: var(--text); }
.chip[draggable="true"] { cursor: grab; }
.chip.drop { outline: 2px dashed var(--accent); }
.dgroup { margin-top: 8px; }
.dgroup > div:first-child { font-size: 11px; color: var(--text-3); margin: 6px 0 2px; }
.dim { display: flex; align-items: center; gap: 6px; width: 100%; border: 0; background: none; padding: 4px 6px; border-radius: 5px; text-align: left; }
.dim:hover { background: var(--surface-2); }
.dim .car { width: 10px; color: var(--text-3); font-size: 10px; }
.dim .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dim .badge { background: var(--accent); color: #fff; border-radius: 999px; font-size: 11px; padding: 0 6px; }
.facet { margin: 2px 0 8px 16px; padding: 6px; border: 1px solid var(--border); border-radius: 7px; background: var(--bg); }
.facet input[type=text] { width: 100%; height: 26px; border: 1px solid var(--border-strong); border-radius: 5px; padding: 0 6px; background: var(--surface); margin-bottom: 4px; }
.facet .opts { display: flex; gap: 8px; font-size: 12px; margin: 2px 0 4px; color: var(--text-2); }
.facet .opts button { border: 0; background: none; color: var(--accent-text); padding: 0; }
.facet .opts label { margin-left: auto; display: flex; gap: 4px; align-items: center; }
.fv { display: flex; align-items: center; gap: 6px; padding: 2px 2px; border-radius: 4px; cursor: pointer; }
.fv:hover { background: var(--surface-2); }
.fv span.l { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fv span.c { color: var(--text-3); font-size: 12px; }
.fv.zero { opacity: .45; }
.fmore { font-size: 12px; color: var(--text-3); padding: 2px; }
.numf { display: flex; gap: 4px; align-items: center; margin-top: 4px; }
.numf select, .numf input { height: 26px; border: 1px solid var(--border-strong); border-radius: 5px; background: var(--surface); padding: 0 4px; min-width: 0; }
.numf input { width: 80px; }

/* ---------- toolbar ---------- */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.tg { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.tg > label { color: var(--text-3); font-size: 12px; }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 4px 10px; color: var(--text-2); }
.seg button[aria-pressed="true"] { background: var(--accent-weak); color: var(--accent-text); font-weight: 600; }
.add { border: 1px dashed var(--border-strong); background: none; border-radius: 999px; padding: 2px 9px; color: var(--text-2); font-size: 12px; }
.add:hover { border-color: var(--accent); color: var(--accent-text); }
.status { color: var(--text-3); font-size: 12px; display: flex; gap: 12px; align-items: center; }
.status .crumbs { color: var(--text-2); }

/* ---------- grid ---------- */
.gw { flex: 1; min-height: 160px; overflow: auto; position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
.gh, .gt, .gr { display: grid; grid-template-columns: var(--cols); width: max-content; min-width: 100%; }
.gh { position: sticky; top: 0; z-index: 3; background: var(--surface-2); font-weight: 600; }
.gt { position: sticky; top: 30px; z-index: 3; background: var(--surface); font-weight: 650; box-shadow: inset 0 -1px 0 var(--border-strong); }
.gb { position: relative; }
.gr { position: absolute; left: 0; height: 26px; background: var(--surface); }
.gr:hover { background: var(--hover); }
.c { padding: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 26px; height: 26px; border-bottom: 1px solid var(--border); }
.gh .c { line-height: 30px; height: 30px; cursor: pointer; user-select: none; color: var(--text-2); }
.gh .c:hover { color: var(--text); }
.gh .c.sorted { color: var(--accent-text); }
.c.n { text-align: right; }
.gh > .c:first-child, .gt > .c:first-child, .gr > .c:first-child { position: sticky; left: 0; z-index: 1; background: inherit; box-shadow: inset -1px 0 0 var(--border); }
.c.link { color: var(--accent-text); cursor: pointer; }
.c.link:hover { text-decoration: underline; }
.c.drill { cursor: pointer; }
.c.drill:hover { color: var(--accent-text); text-decoration: underline; }
.c.bad { background: var(--bad-bg); color: var(--bad-text); font-weight: 600; }
.c.blank { color: transparent; }
.empty { padding: 40px; text-align: center; color: var(--text-3); }

/* ---------- recon ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.card h2 { font-size: 14px; margin: 0 0 8px; display: flex; align-items: center; gap: 10px; }
.card h2 .r { margin-left: auto; font-weight: 400; display: flex; gap: 8px; align-items: center; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 24px; color: var(--text-2); font-size: 12px; }
.meta b { color: var(--text); font-weight: 600; }
.warn { margin-top: 8px; background: var(--warn-bg); border-left: 3px solid var(--warn-border); padding: 6px 10px; border-radius: 4px; font-size: 12px; }
table.t { border-collapse: collapse; width: 100%; }
table.t th, table.t td { padding: 5px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
table.t th { text-align: left; font-weight: 600; color: var(--text-2); background: var(--surface-2); }
table.t td.n, table.t th.n { text-align: right; }
table.t tr.sel td { background: var(--accent-weak); }
table.t tbody tr.click { cursor: pointer; }
table.t tbody tr.click:hover td { background: var(--hover); }
table.t tr.sel:hover td { background: var(--accent-weak); }
table.t tfoot td { font-weight: 650; border-top: 1px solid var(--border-strong); border-bottom: 0; }
.two { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 10px; }
.scrollbox { max-height: 360px; overflow: auto; }
.dbar { position: relative; height: 12px; min-width: 140px; }
.dbar::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--mid); }
.dbar span { position: absolute; top: 1px; height: 10px; }
.dbar .p { left: 50%; background: var(--pos); border-radius: 0 4px 4px 0; }
.dbar .m { right: 50%; background: var(--neg); border-radius: 4px 0 0 4px; }
.legend { font-size: 12px; color: var(--text-2); display: flex; gap: 12px; align-items: center; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; }
details.map { font-size: 12px; color: var(--text-2); margin-top: 8px; }
details.map summary { cursor: pointer; color: var(--accent-text); }
details.map td { white-space: normal; vertical-align: top; }
.recon-grid { height: 62vh; display: flex; }
.recon-grid .gw { height: 100%; }
.tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 4px; background: var(--surface-3); color: var(--text-2); margin-left: 6px; font-weight: 500; }

/* ---------- picker popover ---------- */
.pk { position: fixed; z-index: 50; width: 320px; max-height: 420px; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 9px; box-shadow: var(--shadow); }
.pk input { margin: 8px; height: 30px; border: 1px solid var(--border-strong); border-radius: 6px; padding: 0 8px; background: var(--surface); }
.pk .list { overflow: auto; padding: 0 4px 6px; }
.pk .g { font-size: 11px; font-weight: 650; color: var(--text-3); padding: 8px 8px 2px; text-transform: uppercase; letter-spacing: .04em; }
.pk .it { display: flex; gap: 8px; align-items: center; padding: 4px 8px; border-radius: 5px; cursor: pointer; }
.pk .it:hover, .pk .it.hl { background: var(--hover); }
.pk .it .ck { width: 14px; color: var(--accent); }

/* ---------- drawer ---------- */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100vw); background: var(--surface); border-left: 1px solid var(--border-strong); box-shadow: var(--shadow); z-index: 40; display: flex; flex-direction: column; transform: translateX(105%); transition: transform .16s ease-out; }
.drawer.open { transform: none; }
.drawer header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.drawer header h3 { margin: 0; font-size: 16px; }
.drawer .body { overflow: auto; padding: 12px 16px 40px; display: flex; flex-direction: column; gap: 16px; }
.drawer h4 { margin: 0 0 6px; font-size: 13px; color: var(--text-2); }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px; }
.kv div { display: flex; gap: 10px; padding: 3px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
.kv div span:first-child { color: var(--text-3); min-width: 120px; }
.kv div span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- empty / loader ---------- */
.nodata { max-width: 640px; margin: 10vh auto; padding: 24px; }
.nodata code { background: var(--surface-2); padding: 2px 6px; border-radius: 4px; }
.nodata pre { background: var(--surface-2); padding: 10px 12px; border-radius: 6px; overflow: auto; }

@media (max-width: 860px) {
  .layout { grid-template-columns: 0 minmax(0, 1fr); }
  aside { display: none; }
  .two { grid-template-columns: minmax(0, 1fr); }
  .top { overflow-x: auto; }
}
</style>
</head>
<body>
<div id="app"></div>
<script src="data/dashboard_data.js"></script>
<script>
'use strict';
/* =====================================================================
   Actuarial Data Explorer - single file, no dependencies.
   Data comes from data/dashboard_data.js, built by `python recon.py build`.
   ===================================================================== */
const RH = 26;
const LS_KEY = 'actdash.v1';
const SEARCH_DIMS = ['Policy', 'Claim', 'Reinsured', 'Original Insured', 'Broker'];
const GROUP_ORDER = ['Key', 'Reconciliation', 'Actuarial', 'Finance', 'Claim', 'Posting', 'Amounts', 'Delta', 'Counts',
  'Policy · Reconciliation', 'Policy · Actuarial', 'Policy · Finance', 'Finance (all columns)'];
const TABS = [['recon', 'Reconciliation'], ['policies', 'Policies'], ['claims', 'Claims'], ['postings', 'Postings']];
const TABLE_LABEL = { policies: 'policies', claims: 'claims', postings: 'postings' };

const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = (o) => JSON.parse(JSON.stringify(o));
const vk = (x) => (x === null || x === undefined ? '\u0000' : String(x));
const gi = (g) => { const i = GROUP_ORDER.indexOf(g); return i < 0 ? 99 : i; };

let D = null, META = null, LABELS = {}, RM = [], MAIN = [];
const T = {};
let polRow = null;     // policy ref -> row in T.policies
let postByPol = null;  // pidx -> posting rows

/* ------------------------------------------------------------- presets */
const RECON_D = ['GClmP_D', 'GClmO_D', 'GPrmB_D', 'Pipeline_D', 'GBrok_D', 'GDed_D'];
const PRESETS = {
  policies: [
    { name: 'Reconciliation by Reserving LOB', view: { mode: 'group', groupBy: ['Reserving LOB'], measures: ['#rows', ...RECON_D] } },
    { name: 'Policy list', view: { mode: 'list', listCols: ['Policy', 'Source', 'UWY', 'Reserving LOB', 'Branch', 'Office', 'Policy Type', 'Reinsured'], measures: ['GPrmB_A', 'GGWP_A', 'Incurred_A', 'Claims_N'] } },
    { name: 'GWP: Reserving LOB × UWY', view: { mode: 'group', groupBy: ['Reserving LOB'], colDim: 'UWY', measures: ['GGWP_A'] } },
    { name: 'Incurred by UWY (act vs fin)', view: { mode: 'group', groupBy: ['UWY'], measures: ['#rows', 'Incurred_A', 'Incurred_F', 'Incurred_D'] } },
    { name: 'Premium by Office × Policy Type', view: { mode: 'group', groupBy: ['Office', 'Policy Type'], measures: ['#rows', 'GPrmB_A', 'GPrmB_F', 'GPrmB_D'] } },
  ],
  claims: [
    { name: 'Claims by UWY', view: { mode: 'group', groupBy: ['UWY'], measures: ['#rows', '#pol', 'Paid', 'Case Reserves', 'Incurred'] } },
    { name: 'Claim list', view: { mode: 'list', listCols: ['Policy', 'Claim', 'Claim Type', 'Claim Status', 'UWY', 'Reserving LOB', 'Last Period'], measures: ['Paid', 'Case Reserves', 'Incurred'], sort: { id: 'm:Incurred', dir: 1 } } },
    { name: 'Large claims', filters: { 'Claim Type': { vals: ['Large'], not: false } }, view: { mode: 'list', listCols: ['Policy', 'Claim', 'Claim Status', 'UWY', 'Reserving LOB', 'Reinsured', 'Last Period'], measures: ['Paid', 'Case Reserves', 'Incurred'], sort: { id: 'm:Incurred', dir: 1 } } },
    { name: 'Open claims by Reserving LOB', filters: { 'Claim Status': { vals: ['Open'], not: false } }, view: { mode: 'group', groupBy: ['Reserving LOB'], measures: ['#rows', 'Case Reserves', 'Incurred'] } },
  ],
  postings: [
    { name: 'Paid triangle (UWY × Dev Year, cumulative)', view: { mode: 'group', groupBy: ['UWY'], colDim: 'Dev Year', cum: true, measures: ['GClmP'] } },
    { name: 'Incurred triangle (cumulative)', view: { mode: 'group', groupBy: ['UWY'], colDim: 'Dev Year', cum: true, measures: ['Incurred'] } },
    { name: 'GWP triangle (cumulative)', view: { mode: 'group', groupBy: ['UWY'], colDim: 'Dev Year', cum: true, measures: ['GGWP'] } },
    { name: 'Movements by quarter', view: { mode: 'group', groupBy: ['Quarter'], measures: ['GClmP', 'GClmO', 'Incurred', 'GPrmB', 'GGWP'] } },
    { name: 'Raw postings', view: { mode: 'list', listCols: ['Policy', 'Claim', 'Measure', 'Period', 'Dev Year', 'Cut-off Date', 'UWY', 'Reserving LOB'], measures: ['_value'] } },
  ],
};
const BASE_VIEW = { mode: 'group', groupBy: [], listCols: [], colDim: null, cum: false, measures: [], sort: null };

/* --------------------------------------------------------------- state */
const S = {
  tab: 'recon', units: '', tol: 1, sidebar: true,
  filters: {}, num: [], search: '',
  views: {}, open: [],
  recon: { focus: 'any', byDim: 'Reserving LOB', showAll: false, sort: null },
};
const hist = [];

function snapshot() { return clone({ tab: S.tab, filters: S.filters, num: S.num, search: S.search, views: S.views, recon: S.recon }); }
function pushHist() { hist.push(snapshot()); if (hist.length > 60) hist.shift(); }
function back() { const s = hist.pop(); if (!s) return; Object.assign(S, s); renderAll(); }
let saveTimer = 0;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(LS_KEY, JSON.stringify({ ...snapshot(), units: S.units, tol: S.tol, sidebar: S.sidebar, open: S.open, built: META.built_at })); } catch (e) { /* storage unavailable */ }
  }, 200);
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (!s) return;
    for (const k of ['tab', 'units', 'tol', 'sidebar', 'filters', 'num', 'search', 'views', 'recon', 'open']) if (s[k] !== undefined) S[k] = s[k];
  } catch (e) { /* ignore */ }
}
function view(t) {
  if (!S.views[t]) S.views[t] = { ...clone(BASE_VIEW), ...clone(PRESETS[t][0].view) };
  return S.views[t];
}

/* -------------------------------------------------------------- decode */
function addCol(t, c) { t.cols.set(c.name, c); }
function buildTable(name, spec) {
  const t = { name, n: spec.n, cols: new Map(), pidx: null };
  for (const c of spec.columns) {
    if (c.kind === 'ref') { t.pidx = Int32Array.from(c.values); continue; }
    if (c.kind === 'dim') {
      addCol(t, { name: c.name, label: c.label, kind: 'dim', group: c.group, numeric: c.numeric, dict: c.dict, codes: Int32Array.from(c.codes) });
    } else {
      const v = new Float64Array(spec.n);
      if (c.sparse) { const [ix, vs] = c.sparse; for (let k = 0; k < ix.length; k++) v[ix[k]] = vs[k]; } else v.set(c.values);
      addCol(t, { name: c.name, label: c.label, kind: 'num', group: c.group, src: c.src, values: v });
    }
  }
  return t;
}
function attachPolicy(t, P) {
  const pi = t.pidx;
  for (const pc of P.cols.values()) {
    if (pc.kind !== 'dim' || t.cols.has(pc.name)) continue;
    const codes = new Int32Array(t.n), pcodes = pc.codes;
    for (let i = 0; i < t.n; i++) codes[i] = pcodes[pi[i]];
    addCol(t, { ...pc, codes, group: pc.name === 'Policy' ? 'Key' : 'Policy · ' + pc.group });
  }
}
function countCols(t, rowsLabel) {
  addCol(t, { name: '#rows', label: rowsLabel, kind: 'count', group: 'Counts' });
  if (t.pidx) {
    const pi = t.pidx;

/* ---------------------------------------------------------- aggregation */
function aggregate(t, idx, gb, ms, cd) {
  const M = ms.length;

  const add = (a, i) => {
    a.any = true;

      const m = ms[k];

  for (let j = 0; j < idx.length; j++) {
    const i = idx[j];

    if (numeric) { key = 0; for (let k = 0; k < gb.length; k++) key += gb[k].codes[i] * mult[k]; }
    else { key = ''; for (let k = 0; k < gb.length; k++) key += gb[k].codes[i] + '|'; }
    let g = groups.get(key);
    if (!g) { g = { codes: gb.map((c) => c.codes[i]), acc: newAcc(), cells: cd ? new Map() : null }; groups.set(key, g); }
    add(g.acc, i); add(total, i);

  fin(total); if (colTot) for (const c of colTot.values()) fin(c);

}

let pk = null;

function openPicker(anchor, { items, selected = [], multi = false, onPick, placeholder = 'Search…' }) {
  closePicker();

  el.innerHTML = `<input type="text" placeholder="${esc(placeholder)}"><div class="list"></div>`;
  document.body.appendChild(el);
  const r = anchor.getBoundingClientRect();
  el.style.left = Math.min(r.left, window.innerWidth - 330) + 'px';
  el.style.top = Math.min(r.bottom + 4, window.innerHeight - 430) + 'px';

    const q = input.value.trim().toLowerCase();

    hl = Math.min(hl, Math.max(0, shown.length - 1));

  const anyMode = R.focus === 'any';
  $('#byhost').innerHTML = `<table class="t"><thead><tr><th>${esc(dc.label)}</th><th class="n">Policies</th><th class="n">Discrepant</th>
      ${anyMode ? '<th class="n">Σ |Δ| (all measures)</th><th class="n">Net Δ</th>' : '<th class="n">Actuarial</th><th class="n">Finance</th><th class="n">Δ</th>'}<th style="width:30%">${anyMode ? 'Net Δ' : 'Δ'}</th></tr></thead><tbody>
      ${present.map((k) => `<tr class="click" data-by="${k}"><td>${esc(dval(dc, k))}</td><td class="n">${count(bN[k])}</td><td class="n">${count(bBad[k])}</td>
        ${anyMode ? `<td class="n">${money(bAbs[k])}</td><td class="n">${money(bD[k])}</td>` : `<td class="n">${money(bA[k])}</td><td class="n">${money(bF[k])}</td><td class="n">${money(bD[k])}</td>`}
        <td>${bar(bD[k])}</td></tr>`).join('')}
    </tbody></table>`;

  // coverage
  const sc = P.cols.get('Source'), cov = new Map();
  const ck = R.focus === 'any' ? 'GPrmB' : R.focus;
  for (let j = 0; j < idx.length; j++) {
    const i = idx[j], k = sc.codes[i]; const e = cov.get(k) || { n: 0, A: 0, F: 0 };
    e.n++; e.A += col(ck, 'A')[i]; e.F += col(ck, 'F')[i]; cov.set(k, e);
  }
  const ckl = RM.find((m) => m.key === ck).label;
  $('#covhost').innerHTML = `<div class="muted" style="font-size:12px;margin:-4px 0 6px">${esc(ckl)}</div><table class="t"><thead><tr><th>Source</th><th class="n">Policies</th><th class="n">Actuarial</th><th class="n">Finance</th></tr></thead><tbody>
    ${[...cov.entries()].sort((x, y) => x[0] - y[0]).map(([k, e]) => `<tr class="click" data-src="${k}"><td>${esc(dval(sc, k))}</td><td class="n">${count(e.n)}</td><td class="n">${money(e.A)}</td><td class="n">${money(e.F)}</td></tr>`).join('')}
    </tbody></table><p class="muted" style="margin:8px 0 0;font-size:12px">Click a row to filter. Policies in one source only show their full amount as Δ.</p>`;

  // discrepancy grid
  const rows = []; for (let j = 0; j < idx.length; j++) { const i = idx[j]; if (R.showAll || isBad(i)) rows.push(i); }
  const dims = ['Policy', 'Source', 'UWY', 'Reserving LOB', 'Branch', 'Office', 'Policy Type'].map((n) => P.cols.get(n)).filter(Boolean);
  const cols = dims.map((c) => ({
    id: 'd:' + c.name, label: c.label, num: false, w: c.name === 'Policy' ? 140 : dimWidth(c, rows.slice(0, 300).map((i) => c.codes[i])),
    html: (i) => esc(dval(c, c.codes[i])), raw: (i) => dval(c, c.codes[i]), sortKey: (i) => c.codes[i],
    link: c.name === 'Policy', onClick: (i) => (c.name === 'Policy' ? openPolicy(i) : (addFilterValue(c.name, c.dict[c.codes[i]]), update())),
  }));
  const numCol = (key, s, label) => {
    const vals = col(key, s); let tot = 0; for (const i of rows) tot += vals[i];
    return { id: `m:${key}_${s}`, label, num: true, html: (i) => money(vals[i]), raw: (i) => vals[i], total: money(tot), totalRaw: tot,
      cls: s === 'D' ? (i) => (Math.abs(vals[i]) > tol ? 'bad' : '') : null };
  };
  if (R.focus === 'any') {
    cols.push({ id: 'maxabs', label: 'max |Δ|', num: true, html: (i) => money(Math.max(...MAIN.map((m) => Math.abs(col(m.key, 'D')[i])))), raw: (i) => Math.max(...MAIN.map((m) => Math.abs(col(m.key, 'D')[i]))) });
    MAIN.forEach((m) => cols.push(numCol(m.key, 'D', m.label + ' · Δ')));
  } else {
    const m = RM.find((x) => x.key === R.focus);
    cols.push(numCol(m.key, 'A', m.label + ' · Act'), numCol(m.key, 'F', m.label + ' · Fin'), numCol(m.key, 'D', m.label + ' · Δ'));
    MAIN.filter((x) => x.key !== m.key).forEach((x) => cols.push(numCol(x.key, 'D', x.label + ' · Δ')));
  }
  cols.forEach((c) => { if (!c.w) c.w = numWidth(c.label); });
  const defSort = { id: R.focus === 'any' ? 'maxabs' : `m:${R.focus}_D`, dir: -1, abs: true };
  const sort = R.sort && cols.some((c) => c.id === R.sort.id) ? R.sort : defSort;
  const sc2 = cols.find((c) => c.id === sort.id);
  if (sort.abs) { const key = sc2.raw; rows.sort((x, y) => Math.abs(key(y)) - Math.abs(key(x))); } else sortRows(rows, cols, sort);
  reconGrid = new Grid($('#rghost'));
  reconGrid.set({ cols, rows, total: { label: 'Total' }, sort, onSort: (id) => { R.sort = R.sort && R.sort.id === id ? { id, dir: -R.sort.dir } : { id, dir: cols.find((c) => c.id === id).num ? -1 : 1 }; save(); renderMain(); } });

  // wiring
  page.querySelectorAll('[data-focus]').forEach((tr) => tr.onclick = () => { pushHist(); R.focus = R.focus === tr.dataset.focus ? 'any' : tr.dataset.focus; R.sort = null; update(); });
  $('#bydim').onchange = (e) => { R.byDim = e.target.value; save(); renderMain(); };
  page.querySelectorAll('[data-by]').forEach((tr) => tr.onclick = () => { addFilterValue(dc.name, dc.dict[+tr.dataset.by], false); update(); });
  page.querySelectorAll('[data-src]').forEach((tr) => tr.onclick = () => { addFilterValue('Source', sc.dict[+tr.dataset.src]); update(); });
  $('#showall').onchange = (e) => { R.showAll = e.target.checked; save(); renderMain(); };
  const af = $('#anyfocus'); if (af) af.onclick = () => { pushHist(); R.focus = 'any'; R.sort = null; update(); };
  $('#rcsv').onclick = () => reconGrid.csv(`reconciliation_${R.focus}_${new Date().toISOString().slice(0, 10)}.csv`, true);
}

/* -------------------------------------------------------------- drawer */
function openPolicy(row) {
  const P = T.policies, get = (n) => { const c = P.cols.get(n); return c ? (c.kind === 'dim' ? c.dict[c.codes[row]] : c.values[row]) : null; };
  const ref = get('Policy'), tol = S.tol;
  const attrs = (group) => [...P.cols.values()].filter((c) => c.kind === 'dim' && c.group === group)
    .map((c) => [c.label, c.dict[c.codes[row]]]).filter(([, v]) => v !== null && v !== '');
  const kv = (list) => list.map(([k, v]) => `<div><span>${esc(k)}</span><span title="${esc(v)}">${esc(v)}</span></div>`).join('');
  const recRows = RM.map((m) => {
    const A = get(m.key + '_A'), F = get(m.key + '_F'), Dl = get(m.key + '_D');
    return `<tr><td>${esc(m.label)}</td><td class="n">${money(A)}</td><td class="n">${money(F)}</td><td class="n${Math.abs(Dl) > tol ? ' bad' : ''}" ${Math.abs(Dl) > tol ? 'style="background:var(--bad-bg);color:var(--bad-text);font-weight:600"' : ''}>${money(Dl)}</td></tr>`;
  }).join('');
  // claims
  const C = T.claims, cl = [];
  for (let i = 0; i < C.n; i++) if (C.pidx[i] === row) cl.push(i);
  const cv = (n, i) => { const c = C.cols.get(n); return c.kind === 'dim' ? dval(c, c.codes[i]) : c.values[i]; };
  const claimsHtml = cl.length ? `<table class="t"><thead><tr><th>Claim</th><th>Type</th><th>Status</th><th class="n">Paid</th><th class="n">Case reserves</th><th class="n">Incurred</th><th>Last period</th></tr></thead><tbody>
    ${cl.map((i) => `<tr><td>${esc(cv('Claim', i))}</td><td>${esc(cv('Claim Type', i))}</td><td>${esc(cv('Claim Status', i))}</td><td class="n">${money(cv('Paid', i))}</td><td class="n">${money(cv('Case Reserves', i))}</td><td class="n">${money(cv('Incurred', i))}</td><td>${esc(cv('Last Period', i))}</td></tr>`).join('')}
    </tbody></table>` : '<p class="muted">No claims in the actuarial data.</p>';
  // postings by period
  if (!postByPol) { postByPol = new Map(); const Q = T.postings; for (let i = 0; i < Q.n; i++) { const p = Q.pidx[i]; let a = postByPol.get(p); if (!a) postByPol.set(p, (a = [])); a.push(i); } }
  const Q = T.postings, prs = postByPol.get(row) || [], per = Q.cols.get('Period'), mc = Q.cols.get('Measure'), val = Q.cols.get('_value').values;
  const codes = ['GPrmB', 'GGWP', 'GPrmR', 'GBrok', 'GDed', 'GClmP', 'GClmO'];
  const byPer = new Map();
  for (const i of prs) { const p = per.codes[i]; let e = byPer.get(p); if (!e) byPer.set(p, (e = {})); const m = mc.dict[mc.codes[i]]; e[m] = (e[m] || 0) + val[i]; }
  const used = codes.filter((c) => [...byPer.values()].some((e) => e[c]));
  const perHtml = prs.length ? `<div class="scrollbox"><table class="t"><thead><tr><th>Period</th>${used.map((c) => `<th class="n" title="${esc(LABELS[c] || c)}">${c}</th>`).join('')}</tr></thead><tbody>
    ${[...byPer.keys()].sort((x, y) => y - x).map((p) => `<tr><td>${esc(dval(per, p))}</td>${used.map((c) => `<td class="n">${money(byPer.get(p)[c] || 0)}</td>`).join('')}</tr>`).join('')}
    </tbody></table></div>` : '<p class="muted">No postings in the actuarial data.</p>';
  // finance columns
  const fin = [...P.cols.values()].filter((c) => c.group === 'Finance (all columns)' && Math.abs(c.values[row]) > 0.005);
  const finHtml = fin.length ? `<div class="kv">${fin.map((c) => `<div><span title="${esc(c.label)}">${esc(c.label)}</span><span style="margin-left:auto">${money(c.values[row])}</span></div>`).join('')}</div>` : '<p class="muted">Not in the finance file.</p>';

  const dr = $('#drawer');
  dr.innerHTML = `<header><h3>${esc(ref)}</h3><span class="tag">${esc(get('Source'))}</span><span class="spacer"></span>
      <button class="iconbtn" id="dcopy">Copy ref</button><button class="iconbtn" id="dpost">Postings in explorer</button><button class="iconbtn" id="dclose" title="Close (Esc)">✕</button></header>
    <div class="body">
      <div><h4>Reconciliation <span class="muted" style="font-weight:400">${unitLabel()}</span></h4><table class="t"><thead><tr><th>Measure</th><th class="n">Actuarial</th><th class="n">Finance</th><th class="n">Δ</th></tr></thead><tbody>${recRows}</tbody></table></div>
      <div class="kv">${kv(attrs('Actuarial'))}${kv(attrs('Finance'))}</div>
      <div><h4>Claims (${cl.length})</h4>${claimsHtml}</div>
      <div><h4>Actuarial postings by period (${prs.length})</h4>${perHtml}</div>
      <div><h4>Finance production file - non-zero columns</h4>${finHtml}</div>
    </div>`;
  dr.classList.add('open');
  $('#dclose').onclick = closeDrawer;
  $('#dcopy').onclick = () => { navigator.clipboard?.writeText(ref); $('#dcopy').textContent = 'Copied'; };
  $('#dpost').onclick = () => {
    pushHist(); closeDrawer();
    setFilter('Policy', [ref], false);
    S.tab = 'postings'; const v = view('postings');
    Object.assign(v, { ...clone(BASE_VIEW), ...clone(PRESETS.postings.find((p) => p.view.mode === 'list').view) });
    renderAll();
  };
}
function closeDrawer() { $('#drawer').classList.remove('open'); }

/* ---------------------------------------------------------------- shell */
function renderTop() {
  $('#tabs').innerHTML = TABS.map(([k, l]) => `<button class="tab" role="tab" aria-selected="${S.tab === k}" data-tab="${k}">${l}</button>`).join('');
  $('#units').value = S.units; $('#tol').value = S.tol;
  $('#back').disabled = !hist.length;
  $('#layout').classList.toggle('nosb', !S.sidebar);
}
function renderMain(keepScroll) {
  const page = $('#main');
  page.className = 'page';
  if (S.tab === 'recon') recon(); else explorer(S.tab, keepScroll);
}
function renderAll() { closePicker(); renderTop(); renderSidebar(); renderMain(); save(); }
function update() { closePicker(); renderTop(); refreshSidebarCounts(); renderMain(); save(); }

function boot() {
  const app = $('#app');
  if (!window.ACTDASH_DATA) {
    app.innerHTML = `<div class="nodata"><h2>No data loaded</h2>
      <p>This page reads <code>data/dashboard_data.js</code>, which is generated from the Excel sources and kept out of git.</p>
      <pre>pip install -r requirements.txt
python recon.py build</pre>
      <p>Then reload this page. Alternatively, pick a <code>dashboard_data.js</code> file:</p>
      <input type="file" id="pick" accept=".js,.json"></div>`;
    $('#pick').onchange = async (e) => {
      const file = e.target.files[0]; if (!file) return;
      let text = await file.text(); text = text.replace(/^\s*window\.ACTDASH_DATA\s*=\s*/, '').replace(/;\s*$/, '');
      window.ACTDASH_DATA = JSON.parse(text); boot();
    };
    return;
  }
  decode(window.ACTDASH_DATA);
  load();
  if (!TABS.some(([k]) => k === S.tab)) S.tab = 'recon';
  app.innerHTML = `
    <header class="top">
      <button class="iconbtn" id="tsb" title="Toggle filters panel">☰</button>
      <div class="brand">Actuarial Data Explorer<small>${esc(META.actuarial.as_of || '')}</small></div>
      <nav class="tabs" id="tabs" role="tablist"></nav>
      <span class="spacer"></span>
      <label class="ctl" title="Absolute delta above which a policy counts as a discrepancy">Tolerance <input id="tol" type="number" min="0" step="any"></label>
      <label class="ctl">Units <select id="units"><option value="">USD</option><option value="k">USD k</option><option value="m">USD m</option></select></label>
      <button class="iconbtn" id="back" title="Undo last change (Alt+←)">↶ Back</button>
    </header>
    <div class="layout" id="layout"><aside id="sb"></aside><main id="main" class="page"></main></div>
    <div class="drawer" id="drawer"></div>`;
  $('#tabs').onclick = (e) => { const b = e.target.closest('[data-tab]'); if (b && b.dataset.tab !== S.tab) { S.tab = b.dataset.tab; renderAll(); } };
  $('#units').onchange = (e) => { S.units = e.target.value; renderMain(); save(); };
  let tt = 0;
  $('#tol').oninput = (e) => { clearTimeout(tt); tt = setTimeout(() => { S.tol = Math.max(0, Number(e.target.value) || 0); renderMain(); save(); }, 250); };
  $('#back').onclick = back;
  $('#tsb').onclick = () => { S.sidebar = !S.sidebar; renderTop(); save(); };
  wireSidebar();
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { closePicker(); closeDrawer(); }
    else if (e.key === '/' && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); $('#q')?.focus(); }
    else if (e.altKey && e.key === 'ArrowLeft') { e.preventDefault(); back(); }
  });
  window.addEventListener('resize', () => { for (const g of Object.values(grids)) { g.last = null; g.paint(); } if (reconGrid) { reconGrid.last = null; reconGrid.paint(); } });
  renderAll();
}
boot();
</script>
</body>
</html>
